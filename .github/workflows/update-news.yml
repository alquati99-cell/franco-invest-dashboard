name: Aggiorna notizie

on:
  schedule:
    # Ogni 2 ore, 6-20 UTC (8-22 ora italiana), nei giorni feriali.
    - cron: '15 6-20/2 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: update-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aggiorna notizie
        run: node scripts/update-news.mjs

      - name: Commit notizie aggiornate
        run: |
          git config user.name  "franco-invest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json docs/news.json
          if git diff --staged --quiet; then
            echo "Nessuna notizia nuova."
          else
            git commit -m "chore: aggiorna notizie [skip ci]"
            git push
          fi
